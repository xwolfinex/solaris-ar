<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07040f">
<title>Trippy Cam</title>
<style>
  :root {
    --bg: #07040f;
    --panel: rgba(12, 8, 24, 0.72);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f4f0ff;
    --muted: #b8aed6;
    --accent: #a855f7;
    --accent2: #22d3ee;
    --rec: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: manipulation; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 16px; text-align: center; z-index: 5;
    background: radial-gradient(circle at 50% 35%, #2a1250 0%, var(--bg) 70%); }
  #start h1 { margin: 0; font-size: 28px; letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--accent2), var(--accent), #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { margin: 0; max-width: 340px; color: var(--muted); }
  #err { color: #fca5a5; max-width: 340px; }

  .btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--text);
    border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.primary { border: 0; padding: 14px 28px; font-size: 16px; background: linear-gradient(90deg, #7c3aed, #a855f7); }
  .btn.on { background: var(--accent); border-color: var(--accent); }
  .btn.rec { background: var(--rec); border-color: var(--rec); }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(7,4,15,0.88), rgba(7,4,15,0)); transition: opacity .25s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #groups { display: flex; gap: 6px; padding: 0 16px 6px; overflow-x: auto; scrollbar-width: none; }
  #groups::-webkit-scrollbar { display: none; }
  .grp { flex: 0 0 auto; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px;
    padding: 4px 8px; border-radius: 8px; cursor: pointer; }
  .grp.active { color: var(--text); background: rgba(255,255,255,0.1); }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .chip.active { background: linear-gradient(90deg, #7c3aed, #0891b2); border-color: transparent; font-weight: 600; }
  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; padding: 0 16px 10px; }
  .sliders label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; padding: 0 16px; justify-content: space-between; }
  .row .btn { flex: 1; padding: 10px 4px; font-size: 13px; }
  #hint { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 3; background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px;
    font-size: 12px; color: var(--muted); transition: opacity .4s; pointer-events: none; white-space: nowrap; }
  #toast { position: fixed; top: calc(50px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 4; background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px;
    font-size: 13px; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #trackstat { display: none; position: fixed; top: calc(92px + env(safe-area-inset-top)); left: 16px; right: 16px; z-index: 4;
    background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; font-size: 12px;
    color: var(--muted); word-break: break-word; max-height: 30vh; overflow: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <h1>Trippy Cam</h1>
  <p>Live psychedelic effects on your camera, including effects that track your body, face and hands. Pick an effect, tune it, turn on Mic or Beat to make it react to music, and hit Rec to save a clip.</p>
  <button class="btn primary" id="go">Start camera</button>
  <div id="err"></div>
</div>

<div id="hint">Tap the screen to hide or show controls</div>
<div id="toast"></div>
<div id="trackstat"></div>

<div id="ui" class="hidden">
  <div id="groups"></div>
  <div id="chips"></div>
  <div class="sliders">
    <label>Intensity <input type="range" id="k" min="0" max="1" step="0.01" value="0.6"></label>
    <label>Trails <input type="range" id="tr" min="0" max="0.97" step="0.01" value="0.3"></label>
  </div>
  <div class="row">
    <button class="btn" id="flip">Flip</button>
    <button class="btn" id="reset">Reset cam</button>
    <button class="btn" id="mic">Mic react</button>
    <button class="btn" id="beat">Beat: off</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="protect">Keep me clear</button>
    <button class="btn" id="auto">Auto</button>
    <button class="btn" id="rec">Rec</button>
  </div>
</div>

<script>
(() => {
  // ---------------------------------------------------------------------------
  // Effect list. "id" is the shader branch; "needs" lists the trackers it uses.
  // ---------------------------------------------------------------------------
  const EFFECTS = [
    { name: "Ripples",      id: 0,  group: "Body",  needs: ["seg"] },
    { name: "Aura",         id: 1,  group: "Body",  needs: ["seg"] },
    { name: "Echo Clones",  id: 2,  group: "Body",  needs: ["seg", "hist"] },
    { name: "Cosmic BG",    id: 3,  group: "Body",  needs: ["seg"] },
    { name: "Spiral Eyes",  id: 4,  group: "Face",  needs: ["face"] },
    { name: "Glow Eyes",    id: 5,  group: "Face",  needs: ["face"] },
    { name: "Third Eye",    id: 6,  group: "Face",  needs: ["face"] },
    { name: "Face Melt",    id: 7,  group: "Face",  needs: ["face"] },
    { name: "Face Mirror",  id: 8,  group: "Face",  needs: ["face"] },
    { name: "Mouth Portal", id: 9,  group: "Face",  needs: ["face"] },
    { name: "Hand Sparks",  id: 10, group: "Hands", needs: ["hand"] },
    { name: "Hand Smoke",   id: 11, group: "Hands", needs: ["hand"] },
    { name: "Slit-Scan",    id: 12, group: "Time",  needs: ["hist"] },
    { name: "Kaleido",      id: 13, group: "Trippy", needs: [] },
    { name: "RGB Split",    id: 14, group: "Trippy", needs: [] },
    { name: "Liquid",       id: 15, group: "Trippy", needs: [] },
    { name: "Acid",         id: 16, group: "Trippy", needs: [] },
    { name: "Vortex",       id: 17, group: "Trippy", needs: [] },
    { name: "Mirror",       id: 18, group: "Trippy", needs: [] },
    { name: "Thermal",      id: 19, group: "Trippy", needs: [] },
    { name: "Neon Edges",   id: 20, group: "Trippy", needs: [] },
    { name: "Glitch",       id: 21, group: "Trippy", needs: [] },
    { name: "Tunnel",       id: 22, group: "Trippy", needs: [] },
  ];
  const GROUPS = ["All", "Body", "Face", "Hands", "Time", "Trippy"];

  const $ = id => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const canvas = $("c");
  const video = document.createElement("video");
  video.playsInline = true; video.muted = true; video.setAttribute("playsinline", "");

  let gl, fxProg, blitProg, storeProg, partProg, quadBuf, partBuf, camTex, segTex, fbos = [], fboTex = [], cur = 0;
  let stream = null, facing = "user", mode = 0, auto = false, lastAuto = 0, protect = false;
  let analyser = null, freq = null, audioLevel = 0, bassRaw = 0, bassAvg = 0, micStream = null, audioCtx = null;
  let beatMode = 0, lastBeat = 0, flash = 0;
  let recorder = null, chunks = [], recStart = 0, recTimer = null;
  let lastNow = performance.now();
  const t0 = performance.now();

  function toast(msg, ms = 2500) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), ms);
  }

  // ---------- UI ----------
  let group = "All";
  function renderGroups() {
    $("groups").innerHTML = "";
    GROUPS.forEach(g => {
      const b = document.createElement("button"); b.className = "grp" + (g === group ? " active" : ""); b.textContent = g;
      b.onclick = e => { e.stopPropagation(); group = g; renderGroups(); renderChips(); };
      $("groups").appendChild(b);
    });
  }
  function renderChips() {
    $("chips").innerHTML = "";
    EFFECTS.forEach((fx, i) => {
      if (group !== "All" && fx.group !== group) return;
      const b = document.createElement("button");
      b.className = "chip" + (i === mode ? " active" : ""); b.textContent = fx.name; b.dataset.i = i;
      b.onclick = e => { e.stopPropagation(); setMode(i); if (auto) toggleAuto(); };
      $("chips").appendChild(b);
    });
  }
  function setMode(i) {
    mode = i;
    EFFECTS[i].needs.forEach(n => { if (T[n]) loadTracker(T[n]); });
    [...$("chips").children].forEach(c => c.classList.toggle("active", +c.dataset.i === i));
    const el = [...$("chips").children].find(c => +c.dataset.i === i);
    if (el) el.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    updateStatus();
  }
  function toggleAuto() { auto = !auto; $("auto").classList.toggle("on", auto); lastAuto = performance.now(); }
  $("auto").onclick = e => { e.stopPropagation(); toggleAuto(); };
  $("ui").addEventListener("click", e => e.stopPropagation());
  canvas.addEventListener("click", () => {
    if (!stream) return;
    $("ui").classList.toggle("hidden"); $("hint").style.opacity = 0;
  });
  $("protect").onclick = e => {
    e.stopPropagation(); protect = !protect; $("protect").classList.toggle("on", protect);
    if (protect) loadTracker(T.seg);
    updateStatus();
  };

  // ---------- Camera ----------
  let camBusy = false, lastVT = -1, stallSince = 0;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function startCam() {
    if (camBusy) return;               // ignore overlapping taps (a common cause of frozen feeds)
    camBusy = true;
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null; video.pause(); video.srcObject = null;
      await sleep(250);                // give Android time to release the camera
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      } catch (e) {
        if (e.name === "NotAllowedError") throw e;
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      stream.getVideoTracks().forEach(t => t.onended = () => resetCam("Camera stopped, restarting"));
      video.srcObject = stream; await video.play();
      lastVT = -1; stallSince = 0;
    } finally { camBusy = false; }
  }
  function clearTrails() {
    if (!gl) return;
    fbos.forEach(f => { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); });
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    hist.count = 0;
  }
  async function resetCam(msg) {
    if (camBusy) return;
    if (msg) toast(msg);
    try { await startCam(); clearTrails(); }
    catch (e) { toast("Camera restart failed: " + (e.message || e.name)); }
  }
  $("reset").onclick = e => { e.stopPropagation(); resetCam("Restarting camera"); };
  setInterval(() => {
    updateStatus();
    if (!stream || camBusy || document.hidden) return;
    const tr = stream.getVideoTracks()[0];
    if (!tr || tr.readyState === "ended") { resetCam("Camera stopped, restarting"); return; }
    if (video.currentTime !== lastVT) { lastVT = video.currentTime; stallSince = 0; return; }
    if (!stallSince) stallSince = performance.now();
    else if (performance.now() - stallSince > 2000) resetCam("Camera froze, restarting");
  }, 500);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && stream) setTimeout(() => {
      const tr = stream && stream.getVideoTracks()[0];
      if (!tr || tr.readyState === "ended" || video.paused) resetCam("Restarting camera");
    }, 400);
  });
  $("go").onclick = async () => {
    $("err").textContent = "";
    if (!window.isSecureContext || !navigator.mediaDevices) {
      $("err").textContent = "Camera needs an HTTPS link. Open this page from its GitHub Pages or Netlify URL.";
      return;
    }
    try {
      await startCam(); initGL();
      $("start").style.display = "none"; $("ui").classList.remove("hidden");
      setTimeout(() => $("hint").style.opacity = 0, 4000);
      requestAnimationFrame(frame);
      setMode(mode);
    } catch (e) {
      $("err").textContent = "Could not open the camera: " + (e.message || e.name) + ". Check that camera permission is allowed for this site.";
    }
  };
  $("flip").onclick = async e => {
    e.stopPropagation(); if (camBusy) return;
    facing = facing === "user" ? "environment" : "user";
    try { await startCam(); clearTrails(); } catch (err) { toast("Could not switch camera"); }
  };

  // ---------- Mic + beat detection ----------
  async function micOn() {
    if (micStream) return true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.35;
      src.connect(analyser); freq = new Uint8Array(analyser.frequencyBinCount);
      $("mic").classList.add("on"); return true;
    } catch (err) { toast("Mic permission was blocked"); return false; }
  }
  function micOff() {
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    micStream = null; analyser = null; $("mic").classList.remove("on");
    if (beatMode) { beatMode = 0; $("beat").textContent = "Beat: off"; $("beat").classList.remove("on"); }
  }
  $("mic").onclick = async e => {
    e.stopPropagation();
    if (micStream) micOff(); else if (await micOn()) toast("Mic on: effects pulse with the bass");
  };
  const BEAT_LABELS = ["Beat: off", "Beat: flash", "Beat: switch"];
  $("beat").onclick = async e => {
    e.stopPropagation();
    const next = (beatMode + 1) % 3;
    if (next && !(await micOn())) return;
    beatMode = next; $("beat").textContent = BEAT_LABELS[beatMode]; $("beat").classList.toggle("on", beatMode > 0);
    if (beatMode === 1) toast("Flashes on each kick drum");
    if (beatMode === 2) toast("Flashes and switches effect on each kick drum");
  };
  function readAudio(now, dt) {
    flash *= Math.exp(-dt * 7);
    if (!analyser) { audioLevel *= 0.9; return; }
    analyser.getByteFrequencyData(freq);
    // bins 1-6 cover roughly 45-280 Hz at 48 kHz with fftSize 512: the kick drum range
    let s = 0; for (let i = 1; i <= 6; i++) s += freq[i];
    bassRaw = s / 6 / 255;
    bassAvg = bassAvg * 0.96 + bassRaw * 0.04;
    const v = Math.min(1, Math.max(0, (bassRaw - 0.25) * 1.6));
    audioLevel = audioLevel * 0.7 + v * 0.3;
    if (beatMode && bassRaw > 0.35 && bassRaw > bassAvg * 1.3 && now - lastBeat > 220) {
      lastBeat = now; flash = 1;
      if (beatMode === 2) switchRandom();
      if (EFFECTS[mode].id === 10 || EFFECTS[mode].id === 11) burst();
    }
  }
  function usable(i) { return EFFECTS[i].needs.every(n => !T[n] || T[n].state !== "failed"); }
  function switchRandom() {
    const pool = EFFECTS.map((_, i) => i).filter(i => i !== mode && usable(i) &&
      EFFECTS[i].needs.every(n => !T[n] || T[n].state === "ready"));
    if (pool.length) setMode(pool[Math.floor(Math.random() * pool.length)]);
  }

  // ---------- Recording ----------
  function pickMime() {
    const list = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    return list.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  }
  $("rec").onclick = e => {
    e.stopPropagation();
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    if (!window.MediaRecorder || !canvas.captureStream) { toast("Recording is not supported in this browser. Use screen record instead."); return; }
    const out = canvas.captureStream(30);
    if (micStream) micStream.getAudioTracks().forEach(t => out.addTrack(t));
    const mime = pickMime();
    recorder = new MediaRecorder(out, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined);
    chunks = [];
    recorder.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
    recorder.onstop = () => {
      clearInterval(recTimer); $("rec").classList.remove("rec"); $("rec").textContent = "Rec";
      const type = recorder.mimeType || mime || "video/webm";
      const blob = new Blob(chunks, { type });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "trippy-" + EFFECTS[mode].name.toLowerCase().replace(/\s+/g, "-") + "-" + Date.now() + (type.includes("mp4") ? ".mp4" : ".webm");
      document.body.appendChild(a); a.click(); a.remove();
      toast("Saved " + a.download);
    };
    recorder.start(250); recStart = performance.now();
    $("rec").classList.add("rec");
    recTimer = setInterval(() => {
      const s = Math.floor((performance.now() - recStart) / 1000);
      $("rec").textContent = "Stop " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }, 250);
    $("rec").textContent = "Stop 0:00";
  };

  // ---------------------------------------------------------------------------
  // Trackers: person segmentation, face landmarks, hand landmarks.
  // Each tries the current MediaPipe Tasks library (GPU, then CPU), then falls back
  // to the older MediaPipe "solutions" packages, which ship their models on jsdelivr.
  // ---------------------------------------------------------------------------
  const TASKS_VERSIONS = ["1.0.1", "0.10.21"];
  const MODELS = {
    seg: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite",
    face: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
    hand: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
  };
  const LEGACY = {
    seg:  { pkg: "selfie_segmentation", ver: "0.1.1675465747", cls: "SelfieSegmentation", js: "selfie_segmentation.js",
            opts: { modelSelection: 0, selfieMode: false } },
    face: { pkg: "face_mesh", ver: "0.4.1633559619", cls: "FaceMesh", js: "face_mesh.js",
            opts: { maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5, selfieMode: false } },
    hand: { pkg: "hands", ver: "0.4.1675469240", cls: "Hands", js: "hands.js",
            opts: { maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5, selfieMode: false } },
  };
  const LABELS = { seg: "Person detection", face: "Face tracking", hand: "Hand tracking" };
  const FAKE = { seg: Q.has("fakeseg"), face: Q.has("fakeface"), hand: Q.has("fakehand") };
  const mkT = key => ({ key, state: "idle", via: "", inst: null, delegate: "", busy: false, last: 0, errors: [], seen: 0 });
  const T = { seg: mkT("seg"), face: mkT("face"), hand: mkT("hand") };
  let tasks = null, tasksErr = null;
  const errText = e => String((e && e.message) || e).split("\n")[0].slice(0, 160);

  async function getTasks() {
    if (tasks) return tasks;
    if (tasksErr) throw tasksErr;
    const errs = [];
    for (const ver of TASKS_VERSIONS) {
      try {
        const lib = await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/vision_bundle.mjs`);
        const fileset = await lib.FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${ver}/wasm`);
        tasks = { lib, fileset, ver }; return tasks;
      } catch (e) { errs.push(`library ${ver}: ${errText(e)}`); }
    }
    tasksErr = new Error(errs.join(" | ")); throw tasksErr;
  }
  function createTasks(tr, delegate) {
    const { lib, fileset } = tasks;
    const baseOptions = { modelAssetPath: MODELS[tr.key], delegate };
    if (tr.key === "seg") return lib.ImageSegmenter.createFromOptions(fileset,
      { baseOptions, runningMode: "VIDEO", outputConfidenceMasks: true, outputCategoryMask: false });
    if (tr.key === "face") return lib.FaceLandmarker.createFromOptions(fileset,
      { baseOptions, runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: false });
    return lib.HandLandmarker.createFromOptions(fileset, { baseOptions, runningMode: "VIDEO", numHands: 2 });
  }
  const scriptCache = {};
  function loadScript(src) {
    return scriptCache[src] || (scriptCache[src] = new Promise((res, rej) => {
      const s = document.createElement("script"); s.src = src; s.crossOrigin = "anonymous";
      s.onload = res; s.onerror = () => { delete scriptCache[src]; rej(new Error("could not load " + src)); };
      document.head.appendChild(s);
    }));
  }
  async function createLegacy(tr) {
    const L = LEGACY[tr.key];
    const base = `https://cdn.jsdelivr.net/npm/@mediapipe/${L.pkg}@${L.ver}/`;
    await loadScript(base + L.js);
    const inst = new window[L.cls]({ locateFile: f => base + f });
    inst.setOptions(L.opts);
    inst.onResults(r => onLegacyResult(tr, r));
    await inst.initialize();
    return inst;
  }
  async function loadTracker(tr) {
    if (tr.state === "loading" || tr.state === "ready") return;
    if (FAKE[tr.key]) { tr.state = "ready"; tr.via = "test"; return; }
    tr.state = "loading"; tr.errors = []; updateStatus();
    let inst = null;
    if (!Q.has("legacy")) {
      try {
        await getTasks();
        for (const d of ["GPU", "CPU"]) {
          try { inst = await createTasks(tr, d); tr.via = "tasks " + tasks.ver; tr.delegate = d; break; }
          catch (e) { tr.errors.push(`new ${d}: ${errText(e)}`); }
        }
      } catch (e) { tr.errors.push(errText(e)); }
    }
    if (!inst) {

    f2("uRes", [canvas.width, canvas.height]);
    f2("uCamRes", [video.videoWidth || 1, video.videoHeight || 1]);
    f1("uTime", (now - t0) / 1000);
    f1("uMode", fx.id);
    f1("uK", +$("k").value);
    f1("uTrail", +$("tr").value);
    f1("uAudio", audioLevel);
    f1("uFlash", flash);
    f1("uMirror", facing === "user" ? 1 : 0);
    f2("uHistGrid", [hist.cols, hist.rows]); f1("uHead", hist.head); f1("uHistN", hist.n); f1("uHistCount", hist.tex ? hist.count : 0);
    f2("uEyeA", face.eyeA); f2("uEyeB", face.eyeB); f1("uEyeRad", Math.max(face.eyeRad, 1e-3));
    f2("uThird", face.third); f2("uFaceC", face.c); f2("uFaceS", [Math.max(face.s[0], 1e-3), Math.max(face.s[1], 1e-3)]);
    f1("uRoll", face.roll); f2("uMouth", face.mouth); f1("uMouthW", Math.max(face.mouthW, 1e-3)); f1("uMouthO", face.mouthO);
    f1("uFaceOn", face.on);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    drawParticles();

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(blitProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex[cur]);
    gl.uniform1i(blitProg.u.t, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cur = prev;
  }

  // Startup: ?fx=<name or number> preselects an effect
  const q = Q.get("fx");
  if (q !== null) {
    const i = isNaN(+q) ? EFFECTS.findIndex(e => e.name.toLowerCase().replace(/\s+/g, "") === q.toLowerCase()) : +q;
    if (EFFECTS[i]) mode = i;
  }
  renderGroups(); renderChips();
  window.__dbg = () => ({ mode: EFFECTS[mode].name, trackers: Object.fromEntries(Object.entries(T).map(([k, t]) => [k, { state: t.state, via: t.via, delegate: t.delegate, errors: t.errors }])), segHasPerson, face: face.on, hands: hands.length, hist: hist.count });
})();
</script>
