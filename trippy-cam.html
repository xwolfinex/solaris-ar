<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07040f">
<title>Trippy Cam</title>
<style>
  :root {
    --bg: #07040f;
    --panel: rgba(12, 8, 24, 0.72);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f4f0ff;
    --muted: #b8aed6;
    --accent: #a855f7;
    --accent2: #22d3ee;
    --rec: #ef4444;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: manipulation; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px 16px; text-align: center; z-index: 5;
    background: radial-gradient(circle at 50% 35%, #2a1250 0%, var(--bg) 70%); }
  #start h1 { margin: 0; font-size: 28px; letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--accent2), var(--accent), #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { margin: 0; max-width: 340px; color: var(--muted); }
  #err { color: #fca5a5; max-width: 340px; }

  .btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--text);
    border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.primary { border: 0; padding: 14px 28px; font-size: 16px;
    background: linear-gradient(90deg, #7c3aed, #a855f7); }
  .btn.on { background: var(--accent); border-color: var(--accent); }
  .btn.rec { background: var(--rec); border-color: var(--rec); }

  #ui { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; padding: 10px 0 calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(7,4,15,0.85), rgba(7,4,15,0)); transition: opacity .25s; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 10px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .chip.active { background: linear-gradient(90deg, #7c3aed, #0891b2); border-color: transparent; font-weight: 600; }
  .sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; padding: 0 16px 10px; }
  .sliders label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; padding: 0 16px; justify-content: space-between; }
  .row .btn { flex: 1; padding: 10px 6px; }
  #hint { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 3; background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px;
    font-size: 12px; color: var(--muted); transition: opacity .4s; pointer-events: none; }
  #toast { position: fixed; top: calc(50px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 4; background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px;
    font-size: 13px; max-width: calc(100vw - 32px); opacity: 0; transition: opacity .3s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <h1>Trippy Cam</h1>
  <p>Live psychedelic effects on your camera. Pick an effect, tune intensity and trails, turn on Mic to make it react to music, and hit Rec to save a clip.</p>
  <button class="btn primary" id="go">Start camera</button>
  <div id="err"></div>
</div>

<div id="hint">Tap the screen to hide or show controls</div>
<div id="toast"></div>

<div id="ui" class="hidden">
  <div id="chips"></div>
  <div class="sliders">
    <label>Intensity <input type="range" id="k" min="0" max="1" step="0.01" value="0.6"></label>
    <label>Trails <input type="range" id="tr" min="0" max="0.97" step="0.01" value="0.35"></label>
  </div>
  <div class="row">
    <button class="btn" id="flip">Flip</button>
    <button class="btn" id="mic">Mic react</button>
    <button class="btn" id="auto">Auto</button>
    <button class="btn" id="rec">Rec</button>
  </div>
</div>

<script>
(() => {
  const EFFECTS = ["Kaleido", "RGB Split", "Liquid", "Acid", "Vortex", "Mirror", "Thermal", "Neon Edges", "Glitch", "Tunnel"];
  const $ = id => document.getElementById(id);
  const canvas = $("c");
  const video = document.createElement("video");
  video.playsInline = true; video.muted = true; video.setAttribute("playsinline", "");

  let gl, fxProg, blitProg, camTex, fbos = [], fboTex = [], cur = 0;
  let stream = null, facing = "user", mode = 0, auto = false, lastAuto = 0;
  let analyser = null, freq = null, audioLevel = 0, micStream = null, audioCtx = null;
  let recorder = null, chunks = [], recStart = 0, recTimer = null;
  const t0 = performance.now();

  function toast(msg, ms = 2500) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), ms);
  }

  // ---------- UI ----------
  EFFECTS.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (i === 0 ? " active" : ""); b.textContent = name;
    b.onclick = e => { e.stopPropagation(); setMode(i); if (auto) toggleAuto(); };
    $("chips").appendChild(b);
  });
  function setMode(i) {
    mode = i;
    [...$("chips").children].forEach((c, j) => c.classList.toggle("active", j === i));
    $("chips").children[i].scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }
  function toggleAuto() { auto = !auto; $("auto").classList.toggle("on", auto); lastAuto = performance.now(); }
  $("auto").onclick = e => { e.stopPropagation(); toggleAuto(); };
  $("ui").addEventListener("click", e => e.stopPropagation());
  canvas.addEventListener("click", () => {
    if (!stream) return;
    $("ui").classList.toggle("hidden"); $("hint").style.opacity = 0;
  });

  // ---------- Camera ----------
  async function startCam() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    });
    video.srcObject = stream; await video.play();
  }
  $("go").onclick = async () => {
    $("err").textContent = "";
    if (!window.isSecureContext || !navigator.mediaDevices) {
      $("err").textContent = "Camera needs an HTTPS link. Open this page from its GitHub Pages or Netlify URL.";
      return;
    }
    try {
      await startCam(); initGL();
      $("start").style.display = "none"; $("ui").classList.remove("hidden");
      setTimeout(() => $("hint").style.opacity = 0, 4000);
      requestAnimationFrame(frame);
    } catch (e) {
      $("err").textContent = "Could not open the camera: " + (e.message || e.name) + ". Check that camera permission is allowed for this site.";
    }
  };
  $("flip").onclick = async e => {
    e.stopPropagation(); facing = facing === "user" ? "environment" : "user";
    try { await startCam(); } catch (err) { toast("Could not switch camera"); }
  };

  // ---------- Mic (audio reactive) ----------
  $("mic").onclick = async e => {
    e.stopPropagation();
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop()); micStream = null; analyser = null;
      $("mic").classList.remove("on"); return;
    }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.6;
      src.connect(analyser); freq = new Uint8Array(analyser.frequencyBinCount);
      $("mic").classList.add("on"); toast("Mic on: effects now pulse with the bass");
    } catch (err) { toast("Mic permission was blocked"); }
  };
  function readAudio() {
    if (!analyser) { audioLevel *= 0.9; return; }
    analyser.getByteFrequencyData(freq);
    let s = 0; for (let i = 1; i < 10; i++) s += freq[i];
    const v = Math.min(1, Math.max(0, (s / 9 / 255 - 0.25) * 1.6));
    audioLevel = audioLevel * 0.7 + v * 0.3;
  }

  // ---------- Recording ----------
  function pickMime() {
    const list = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    return list.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  }
  $("rec").onclick = e => {
    e.stopPropagation();
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    if (!window.MediaRecorder || !canvas.captureStream) { toast("Recording is not supported in this browser. Use screen record instead."); return; }
    const out = canvas.captureStream(30);
    if (micStream) micStream.getAudioTracks().forEach(t => out.addTrack(t));
    const mime = pickMime();
    recorder = new MediaRecorder(out, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined);
    chunks = [];
    recorder.ondataavailable = ev => ev.data.size && chunks.push(ev.data);
    recorder.onstop = () => {
      clearInterval(recTimer); $("rec").classList.remove("rec"); $("rec").textContent = "Rec";
      const type = recorder.mimeType || mime || "video/webm";
      const blob = new Blob(chunks, { type });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "trippy-" + EFFECTS[mode].toLowerCase().replace(/\s+/g, "-") + "-" + Date.now() + (type.includes("mp4") ? ".mp4" : ".webm");
      document.body.appendChild(a); a.click(); a.remove();
      toast("Saved " + a.download);
    };
    recorder.start(250); recStart = performance.now();
    $("rec").classList.add("rec");
    recTimer = setInterval(() => {
      const s = Math.floor((performance.now() - recStart) / 1000);
      $("rec").textContent = "Stop " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }, 250);
    $("rec").textContent = "Stop 0:00";
  };

  // ---------- WebGL ----------
  const VS = `attribute vec2 p; varying vec2 v; void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;
  const BLIT = `precision mediump float; varying vec2 v; uniform sampler2D t; void main(){ gl_FragColor = texture2D(t, v); }`;
  const FX = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;
uniform sampler2D uCam, uPrev;
uniform vec2 uRes, uCamRes;
uniform float uTime, uMode, uK, uTrail, uAudio, uMirror;
#define PI 3.14159265
#define TAU 6.2831853

vec2 mw(vec2 x){ return 1.0 - abs(1.0 - mod(x, 2.0)); }
vec2 camUV(vec2 uv){
  uv = mw(uv);
  float sa = uRes.x/uRes.y, ca = uCamRes.x/max(uCamRes.y, 1.0);
  if (sa > ca) uv.y = 0.5 + (uv.y-0.5)*(ca/sa); else uv.x = 0.5 + (uv.x-0.5)*(sa/ca);
  if (uMirror > 0.5) uv.x = 1.0 - uv.x;
  return uv;
}
vec3 cam(vec2 uv){ return texture2D(uCam, camUV(uv)).rgb; }
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
vec3 hue(vec3 c, float h){
  const mat3 toYIQ = mat3(0.299,0.596,0.211, 0.587,-0.274,-0.523, 0.114,-0.322,0.312);
  const mat3 toRGB = mat3(1.0,1.0,1.0, 0.956,-0.272,-1.106, 0.621,-0.647,1.703);
  vec3 y = toYIQ*c; float cs = cos(h), sn = sin(h);
  y.yz = vec2(y.y*cs - y.z*sn, y.y*sn + y.z*cs);
  return toRGB*y;
}
vec3 pal(float t){ return 0.5 + 0.5*cos(TAU*(t + vec3(0.0, 0.33, 0.67))); }
float hash(float n){ return fract(sin(n)*43758.5453); }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

void main(){
  vec2 uv = v; float t = uTime;
  float k = uK*(1.0 + uAudio*1.5);
  float asp = uRes.x/uRes.y;
  vec2 A = vec2(asp, 1.0);
  vec2 p = (uv - 0.5)*A;
  vec3 col;

  if (uMode < 0.5) {                       // Kaleido
    float r = length(p)*(1.0 - 0.2*uAudio); float a = atan(p.y, p.x) + t*0.15;
    float s = TAU/(4.0 + floor(uK*8.0));
    a = mod(a, s); a = abs(a - s*0.5);
    vec2 q = r*vec2(cos(a), sin(a))*(1.0 - 0.15*sin(t*0.5));
    col = cam(q/A + 0.5);
  } else if (uMode < 1.5) {                // RGB Split
    vec2 o = (0.004 + 0.04*k)*vec2(cos(t*1.3), sin(t*0.9));
    col = vec3(cam(uv + o).r, cam(uv).g, cam(uv - o).b);
    col *= 0.92 + 0.08*sin(uv.y*uRes.y*1.2);
  } else if (uMode < 2.5) {                // Liquid
    vec2 w = uv + (0.008 + 0.05*k)*vec2(
      sin(uv.y*9.0 + t*2.0) + 0.4*sin(uv.y*23.0 - t*3.1),
      cos(uv.x*8.0 + t*1.7) + 0.4*cos(uv.x*19.0 + t*2.3));
    col = hue(cam(w), k*2.0*sin(t*0.3));
  } else if (uMode < 3.5) {                // Acid
    vec3 c = cam(uv);
    col = hue(c, t*0.8 + lum(c)*k*6.0);
    col = mix(vec3(lum(col)), col, 1.0 + k*1.5);
    float lv = mix(12.0, 3.0, uK); col = floor(col*lv + 0.5)/lv;
  } else if (uMode < 4.5) {                // Vortex
    float r = length(p); float a = atan(p.y, p.x);
    a += (0.5 + k*4.0)*sin(t*0.6)*exp(-r*2.5);
    col = cam(r*vec2(cos(a), sin(a))/A + 0.5);
  } else if (uMode < 5.5) {                // Mirror
    vec2 q = abs(p)*(1.0 + 0.3*k*sin(t*0.7));
    q = rot(t*0.1*k)*q;
    col = cam(q/A + 0.5);
  } else if (uMode < 6.5) {                // Thermal
    float l = lum(cam(uv));
    col = pal(l*(1.0 + k*2.0) - t*0.15);
  } else if (uMode < 7.5) {                // Neon Edges
    vec2 px = 1.5/uRes;
    float tl = lum(cam(uv + px*vec2(-1, 1))), tc = lum(cam(uv + px*vec2(0, 1))), tr = lum(cam(uv + px*vec2(1, 1)));
    float ml = lum(cam(uv + px*vec2(-1, 0))), mr = lum(cam(uv + px*vec2(1, 0)));
    float bl = lum(cam(uv + px*vec2(-1, -1))), bc = lum(cam(uv + px*vec2(0, -1))), br = lum(cam(uv + px*vec2(1, -1)));
    float gx = tr + 2.0*mr + br - tl - 2.0*ml - bl;
    float gy = tl + 2.0*tc + tr - bl - 2.0*bc - br;
    float e = length(vec2(gx, gy));
    col = pal(e*2.0 + t*0.2 + uv.y)*smoothstep(0.05, 0.4, e)*2.0 + cam(uv)*(1.0 - uK)*0.6;
  } else if (uMode < 8.5) {                // Glitch
    float bands = mix(8.0, 40.0, hash(floor(t*6.0)));
    float row = floor(uv.y*bands);
    float step10 = floor(t*10.0);
    vec2 w = uv;
    if (hash(row + step10*13.0) > 1.0 - k*0.6) w.x += (hash(row*3.1 + step10) - 0.5)*0.25*k;
    float o = 0.01*k + 0.02*uAudio;
    col = vec3(cam(w + vec2(o, 0.0)).r, cam(w).g, cam(w - vec2(o, 0.0)).b);
    if (hash(row*7.7 + step10) > 0.97) col = 1.0 - col;
  } else {                                 // Tunnel
    float r = max(length(p), 0.001); float a = atan(p.y, p.x);
    vec2 q = vec2(a/PI + t*0.03, 0.25/r + t*(0.2 + 0.4*k));
    vec3 tc = cam(q)*smoothstep(0.02, 0.3, r);
    col = mix(cam(uv), tc, clamp(0.4 + uK, 0.0, 1.0));
  }

  // Feedback trails (melting echo with slow zoom, twist and hue drift)
  vec2 pu = rot(0.003*uTrail)*((uv - 0.5)*(1.0 - 0.006*uTrail)) + 0.5;
  vec3 pc = hue(texture2D(uPrev, pu).rgb, 0.06*uTrail);
  col = mix(clamp(col, 0.0, 1.0), pc, uTrail*0.92);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    p.u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); p.u[info.name] = gl.getUniformLocation(p, info.name); }
    return p;
  }
  function makeTex() {
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
    if (canvas.width === w && canvas.height === h && fbos.length) return;
    canvas.width = w; canvas.height = h;
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    for (let i = 0; i < 2; i++) {
      if (!fboTex[i]) { fboTex[i] = makeTex(); fbos[i] = gl.createFramebuffer(); }
      gl.bindTexture(gl.TEXTURE_2D, fboTex[i]);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[i]);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex[i], 0);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  function initGL() {
    if (gl) return;
    gl = canvas.getContext("webgl", { antialias: false, alpha: false, preserveDrawingBuffer: false });
    if (!gl) throw new Error("WebGL is not available");
    fxProg = program(FX); blitProg = program(BLIT);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    camTex = makeTex();
    resize(); addEventListener("resize", resize);
  }

  function frame(now) {
    requestAnimationFrame(frame);
    resize(); readAudio();
    if (auto && now - lastAuto > 6000) { lastAuto = now; setMode((mode + 1) % EFFECTS.length); }

    if (video.readyState >= 2) {
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, camTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    }
    const prev = cur ^ 1;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbos[cur]);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(fxProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, camTex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboTex[prev]);
    const u = fxProg.u;
    gl.uniform1i(u.uCam, 0); gl.uniform1i(u.uPrev, 1);
    gl.uniform2f(u.uRes, canvas.width, canvas.height);
    gl.uniform2f(u.uCamRes, video.videoWidth || 1, video.videoHeight || 1);
    gl.uniform1f(u.uTime, (now - t0) / 1000);
    gl.uniform1f(u.uMode, mode);
    gl.uniform1f(u.uK, +$("k").value);
    gl.uniform1f(u.uTrail, +$("tr").value);
    gl.uniform1f(u.uAudio, audioLevel);
    gl.uniform1f(u.uMirror, facing === "user" ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.useProgram(blitProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex[cur]);
    gl.uniform1i(blitProg.u.t, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cur = prev;
  }

  // Test hook: ?fx=3 preselects an effect
  const q = new URLSearchParams(location.search).get("fx");
  if (q !== null && EFFECTS[+q]) setMode(+q);
})();
</script>
</body>
</html>
